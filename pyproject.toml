[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mayaunittest"
version = "0.1.3"
description = "Unittest utilities for Autodesk Maya"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "David Lantos" }]

requires-python = ">=3.7"

dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
mayaunittest = "cli:main"

[tool.setuptools]
package-dir = { "" = "python" }
py-modules = ["cli", "mayaunittest"]